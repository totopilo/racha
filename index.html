<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF2EC">
<title>Racha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racha">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a pocket logbook; today's checklist first, detail in a bottom sheet */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --ink:#16231C; --muted:#5E6E64; --line:#D5DDD3;
  --accent:#1F5B43; --accent-ink:#FFFFFF; --soft:#E2EAE0; --danger:#B3261E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#18231D; --ink:#E7EFE8; --muted:#94A69A; --line:#2A3830;
  --accent:#8FD3A8; --accent-ink:#0F1713; --soft:#22302A; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#18231D; --ink:#E7EFE8; --muted:#94A69A; --line:#2A3830;
  --accent:#8FD3A8; --accent-ink:#0F1713; --soft:#22302A; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.date{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;color:var(--muted);font-size:12px;font-weight:600}
.day span{font-family:var(--display);font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.day.sel{background:var(--ink);color:var(--bg)}.day.sel span{color:var(--bg)}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day i.full{background:var(--accent)}.day.sel i.full{background:var(--bg)}
.list{display:flex;flex-direction:column;gap:10px}
.habit{background:var(--surface);border-radius:20px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line)}
.habit .info{min-width:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.habit .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:baseline;gap:4px;color:var(--ink);font-weight:600}
.streak strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--hc)}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--soft)}
.dots i.on{background:var(--hc)}
.check{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--hc);display:grid;place-items:center;transition:transform .15s}
.check svg{opacity:0;transition:opacity .15s}
.check.on{background:var(--hc)}.check.on svg{opacity:1}
.check:active{transform:scale(.9)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1.5px dashed var(--line);border-radius:20px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.note button{font-weight:700;color:var(--accent);white-space:nowrap}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);
  padding:15px 26px;border-radius:999px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
.top-actions{display:flex;justify-content:flex-end}
.link{color:var(--muted);font-size:14px;font-weight:600;padding:6px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:24px 24px 0 0;max-height:90%;overflow:auto;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.check{transition:none}}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-size:26px;margin:0;overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],textarea{font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:110px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid transparent}
.colors button.sel{border-color:var(--ink)}
.row{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--hc)}
.stat small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head strong{font-weight:700}
.cal-head button{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700}
.cal button{aspect-ratio:1;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;max-width:100%}
.cal button.on{background:var(--hc);border-color:var(--hc);color:#fff;font-weight:700}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal button:disabled{opacity:.3}
.hint{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:30}
.confirm{background:var(--surface);border:1px solid var(--danger);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <div class="date" id="dateLbl"></div>
      <h1 id="title">Hoy</h1>
    </div>
    <div class="ring" aria-label="Progreso del día">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--soft)" stroke-width="7"/><circle id="ringArc" cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <b id="ringTxt">0/0</b>
    </div>
  </header>
  <nav class="week" id="week" aria-label="Elegir día"></nav>
  <div id="noteSlot"></div>
  <section class="list" id="list"></section>
  <div class="top-actions"><button class="link" id="settingsBtn">Copia de seguridad</button></div>
</div>
<button class="fab" id="addBtn">+ Nuevo hábito</button>
<div id="sheetSlot"></div>
<div id="toastSlot"></div>

<script>
(function(){
const KEY='racha.v1';
const COLORS=['#2E7D5B','#2F5FD0','#D2541F','#B03A8C','#C69214','#118A9A','#6B4FD3','#D23B3B'];
const WD=['L','M','X','J','V','S','D'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLong=d=>d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

function sample(){
  const t=today(),mk=(name,color,pattern)=>{const done={};for(let i=0;i<40;i++){if(pattern(i))done[ymd(addDays(t,-i))]=1}return{id:Math.random().toString(36).slice(2),name,color,done,example:true}};
  return {habits:[
    mk('Beber 2 litros de agua',COLORS[1],i=>i>0&&i<12||i>14&&i%3),
    mk('Leer 20 minutos',COLORS[2],i=>i>0&&i<6||i>7&&i%2),
    mk('Caminar 30 minutos',COLORS[0],i=>i%4!==2&&i>0),
  ]};
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.habits))state=sample();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

let sel=today();
function streak(h){
  let d=today(); if(!h.done[ymd(d)]) d=addDays(d,-1);
  let n=0; while(h.done[ymd(d)]){n++;d=addDays(d,-1)} return n;
}
function best(h){
  const ks=Object.keys(h.done).filter(k=>h.done[k]).sort(); let b=0,c=0,prev=null;
  for(const k of ks){const d=parse(k);c=(prev&&ymd(addDays(prev,1))===k)?c+1:1;b=Math.max(b,c);prev=d}
  return b;
}
function rate30(h){let n=0;const t=today();for(let i=0;i<30;i++)if(h.done[ymd(addDays(t,-i))])n++;return Math.round(n/30*100)}
const total=h=>Object.values(h.done).filter(Boolean).length;
const dias=n=>n===1?'día':'días';

const $=id=>document.getElementById(id);
function render(){
  const t=today(), isToday=ymd(sel)===ymd(t), key=ymd(sel);
  $('dateLbl').textContent=fmtLong(sel);
  $('title').textContent=isToday?'Hoy':(ymd(sel)===ymd(addDays(t,-1))?'Ayer':sel.toLocaleDateString('es-ES',{weekday:'long'}).replace(/^./,c=>c.toUpperCase()));
  // week
  let w='';
  for(let i=6;i>=0;i--){const d=addDays(t,-i),k=ymd(d);const all=state.habits.length&&state.habits.every(h=>h.done[k]);
    const wd=WD[(d.getDay()+6)%7];
    w+=`<button class="day${k===key?' sel':''}" data-d="${k}" aria-label="${esc(fmtLong(d))}">${wd}<span>${d.getDate()}</span><i class="${all?'full':''}"></i></button>`}
  $('week').innerHTML=w;
  // ring
  const n=state.habits.length, done=state.habits.filter(h=>h.done[key]).length;
  $('ringTxt').textContent=done+'/'+n;
  $('ringArc').setAttribute('stroke-dashoffset',String(169.6*(1-(n?done/n:0))));
  // note
  $('noteSlot').innerHTML=state.habits.some(h=>h.example)?`<div class="note"><span>Estos hábitos son de ejemplo para que veas cómo funciona.</span><button id="clearEx">Quitar ejemplos</button></div>`:'';
  // list
  if(!n){$('list').innerHTML=`<div class="empty">Aún no tienes hábitos.<br>Toca <strong>+ Nuevo hábito</strong> para crear el primero.</div>`;return}
  $('list').innerHTML=state.habits.map(h=>{
    const s=streak(h), on=!!h.done[key];
    let dots='';for(let i=6;i>=0;i--)dots+=`<i class="${h.done[ymd(addDays(t,-i))]?'on':''}"></i>`;
    return `<article class="habit" style="--hc:${h.color}">
      <button class="info" data-open="${h.id}">
        <span class="name">${esc(h.name)}</span>
        <span class="meta"><span class="streak"><strong>${s}</strong> ${dias(s)} de racha</span><span class="dots" aria-hidden="true">${dots}</span></span>
      </button>
      <button class="check${on?' on':''}" data-toggle="${h.id}" aria-pressed="${on}" aria-label="Marcar ${esc(h.name)}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button></article>`}).join('');
}

function toast(msg){$('toastSlot').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toastSlot').innerHTML='',1800)}
function closeSheet(){$('sheetSlot').innerHTML=''}
function sheet(html,onMount){
  $('sheetSlot').innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}</div></div>`;
  onMount&&onMount($('sheetSlot').querySelector('.sheet-in'));
}

function editSheet(h){
  const isNew=!h; let color=h?h.color:COLORS[state.habits.length%COLORS.length];
  sheet(`<h2>${isNew?'Nuevo hábito':'Editar hábito'}</h2>
    <label class="f">Nombre<input type="text" id="hName" maxlength="60" placeholder="Por ejemplo: Meditar 10 minutos" value="${h?esc(h.name):''}"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:8px"><span class="f">Color</span><div class="colors" id="hColors">${COLORS.map(c=>`<button style="--c:${c}" data-c="${c}" class="${c===color?'sel':''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
    <div class="row"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="hSave">${isNew?'Crear hábito':'Guardar'}</button></div>`,
  root=>{
    const inp=root.querySelector('#hName'); if(isNew)setTimeout(()=>inp.focus(),50);
    root.querySelector('#hColors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;root.querySelectorAll('#hColors button').forEach(x=>x.classList.toggle('sel',x===b))};
    const go=()=>{const name=inp.value.trim();if(!name){inp.focus();toast('Escribe un nombre');return}
      if(isNew)state.habits.push({id:Math.random().toString(36).slice(2),name,color,done:{}});else{h.name=name;h.color=color;delete h.example}
      save();closeSheet();render();toast(isNew?'Hábito creado':'Cambios guardados')};
    root.querySelector('#hSave').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go()};
  });
}

function detailSheet(h){
  let month=new Date(today().getFullYear(),today().getMonth(),1);
  sheet('<div id="dBody" style="display:contents"></div>',root=>{
    const body=root.querySelector('#dBody');
    const draw=()=>{
      const t=today(), first=month, days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(), lead=(first.getDay()+6)%7;
      let cal=WD.map(x=>`<span class="wd">${x}</span>`).join('')+'<span></span>'.repeat(lead);
      for(let i=1;i<=days;i++){const d=new Date(first.getFullYear(),first.getMonth(),i),k=ymd(d);
        cal+=`<button data-k="${k}" class="${h.done[k]?'on':''}${k===ymd(t)?' today':''}" ${d>t?'disabled':''}>${i}</button>`}
      const s=streak(h);
      body.innerHTML=`<div style="--hc:${h.color};display:flex;flex-direction:column;gap:16px">
        <h2>${esc(h.name)}</h2>
        <div class="stats">
          <div class="stat"><small>Racha actual</small><b>${s}</b>${dias(s)}</div>
          <div class="stat"><small>Mejor racha</small><b>${best(h)}</b>${dias(best(h))}</div>
          <div class="stat"><small>Últimos 30 días</small><b>${rate30(h)}%</b>cumplido</div>
          <div class="stat"><small>Total</small><b>${total(h)}</b>${dias(total(h))} hechos</div>
        </div>
        <div class="cal-head"><button id="prevM" aria-label="Mes anterior">‹</button><strong>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</strong><button id="nextM" aria-label="Mes siguiente" ${first.getMonth()===t.getMonth()&&first.getFullYear()===t.getFullYear()?'disabled style="opacity:.3"':''}>›</button></div>
        <div class="cal" id="cal">${cal}</div>
        <p class="hint">Toca un día para marcarlo o desmarcarlo si se te olvidó registrarlo.</p>
        <div class="row"><button class="btn" id="dEdit">Editar</button><button class="btn danger" id="dDel">Eliminar</button></div>
        <div id="confirmSlot"></div>
        <button class="btn" data-close>Cerrar</button></div>`;
      body.querySelector('#cal').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||b.disabled)return;const k=b.dataset.k;if(h.done[k])delete h.done[k];else h.done[k]=1;save();render();draw()};
      body.querySelector('#prevM').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);draw()};
      body.querySelector('#nextM').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);draw()};
      body.querySelector('#dEdit').onclick=()=>editSheet(h);
      body.querySelector('#dDel').onclick=()=>{body.querySelector('#confirmSlot').innerHTML=`<div class="confirm"><span>¿Eliminar <strong>${esc(h.name)}</strong> y todo su historial? No se puede deshacer.</span><div class="row"><button class="btn" id="cNo">Cancelar</button><button class="btn danger" id="cYes">Sí, eliminar</button></div></div>`;
        body.querySelector('#cNo').onclick=()=>body.querySelector('#confirmSlot').innerHTML='';
        body.querySelector('#cYes').onclick=()=>{state.habits=state.habits.filter(x=>x!==h);save();closeSheet();render();toast('Hábito eliminado')}};
    };
    draw();
  });
}

function backupSheet(){
  const data=JSON.stringify(state);
  sheet(`<h2>Copia de seguridad</h2>
    <p class="hint">Tus hábitos se guardan solo en este teléfono. Copia este texto y guárdalo en Notas de vez en cuando. Para restaurar, pégalo abajo.</p>
    <textarea id="bOut" readonly>${esc(data)}</textarea>
    <button class="btn primary" id="bCopy">Copiar copia de seguridad</button>
    <label class="f">Restaurar desde una copia<textarea id="bIn" placeholder="Pega aquí el texto de tu copia"></textarea></label>
    <button class="btn" id="bLoad">Restaurar</button>
    <button class="btn" data-close>Cerrar</button>`,root=>{
    root.querySelector('#bCopy').onclick=()=>{const ta=root.querySelector('#bOut');
      const fb=()=>{ta.focus();ta.select();toast('Texto seleccionado, cópialo')};
      try{navigator.clipboard.writeText(data).then(()=>toast('Copiado'),fb)}catch(e){fb()}};
    root.querySelector('#bLoad').onclick=()=>{try{const s=JSON.parse(root.querySelector('#bIn').value);if(!s||!Array.isArray(s.habits))throw 0;state=s;save();closeSheet();render();toast('Copia restaurada')}catch(e){toast('Ese texto no es una copia válida')}};
  });
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')){closeSheet();return}
  const d=t.closest('[data-d]'); if(d){sel=parse(d.dataset.d);render();return}
  const tg=t.closest('[data-toggle]'); if(tg){const h=state.habits.find(x=>x.id===tg.dataset.toggle),k=ymd(sel);
    if(h.done[k])delete h.done[k];else{h.done[k]=1;if(navigator.vibrate)navigator.vibrate(10)}save();render();return}
  const o=t.closest('[data-open]'); if(o){detailSheet(state.habits.find(x=>x.id===o.dataset.open));return}
  if(t.closest('#clearEx')){state.habits=state.habits.filter(h=>!h.example);save();render();toast('Ejemplos quitados');return}
});
$('addBtn').onclick=()=>editSheet(null);
$('settingsBtn').onclick=backupSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
